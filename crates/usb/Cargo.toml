[package]
name = "ch32rv-usb"
description = "USB device enumeration, probe selectors, per-device locking, and transaction capture for the ch32rv tool suite (nusb wrapper)"
keywords = ["ch32", "wch", "usb", "embedded", "probe"]
categories = ["embedded", "hardware-support"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ch32rv-contract = { workspace = true }
nusb = { workspace = true }
thiserror = { workspace = true }
fs4 = { workspace = true }
serde_json = { workspace = true }

# en: Windows fallback backend — WCH stock vendor driver (docs/windows-wch-driver.ja.md §4)
# ja: Windows フォールバック backend — WCH 純正ドライバ経路
[target.'cfg(windows)'.dependencies]
ch32rv-usb-wch-win = { workspace = true }

# en: serial port -> USB device on the platforms without sysfs (`port:` selector)
# ja: sysfs の無い OS で serial port → USB device を引く(`port:` selector)
[target.'cfg(not(target_os = "linux"))'.dependencies]
serialport = { workspace = true }

[lints]
workspace = true
