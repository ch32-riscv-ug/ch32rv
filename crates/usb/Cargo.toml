[package]
name = "ch32rv-usb"
description = "USB device enumeration, probe selectors, per-device locking, and transaction capture for the ch32rv tool suite (nusb wrapper) (a part of the ch32rv CLI; no API or semver promise)"
keywords = ["ch32", "wch", "usb", "embedded", "probe"]
categories = ["embedded", "hardware-support"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ch32rv-contract = { workspace = true }
nusb = { workspace = true }
thiserror = { workspace = true }
fs4 = { workspace = true }
serde_json = { workspace = true }

# en: Windows fallback backend — WCH stock vendor driver (docs/windows-wch-driver.ja.md §4)
# ja: Windows フォールバック backend — WCH 純正ドライバ経路
# en: the user id for the per-user runtime dir when XDG_RUNTIME_DIR is not set
# ja: XDG_RUNTIME_DIR が無いときの利用者ごとの runtime dir の uid
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
ch32rv-usb-wch-win = { workspace = true }

# en: serial port -> USB device on the platforms without sysfs (a serial port path as a selector)
# ja: sysfs の無い OS で serial port → USB device を引く(serial port の path の selector)
[target.'cfg(not(target_os = "linux"))'.dependencies]
serialport = { workspace = true }

[lints]
workspace = true
