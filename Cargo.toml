[workspace]
resolver = "3"
members = [
    "crates/contract",
    "crates/usb",
    "crates/wchlink",
    "crates/dmi",
    "crates/target",
    "crates/flash",
    "crates/debug",
    "crates/monitor",
    "crates/isp",
    "crates/boot",
    "cli",
    "xtask",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ch32-riscv-ug/ch32rv"
authors = ["CH32 RISC-V User Group"]

[workspace.dependencies]
# 内部 crate
ch32rv-contract = { path = "crates/contract", version = "0.1.3" }
ch32rv-usb = { path = "crates/usb", version = "0.1.3" }
ch32rv-wchlink = { path = "crates/wchlink", version = "0.1.3" }
ch32rv-dmi = { path = "crates/dmi", version = "0.1.3" }
ch32rv-target = { path = "crates/target", version = "0.1.3" }
ch32rv-flash = { path = "crates/flash", version = "0.1.3" }
ch32rv-debug = { path = "crates/debug", version = "0.1.3" }
ch32rv-monitor = { path = "crates/monitor", version = "0.1.3" }
ch32rv-isp = { path = "crates/isp", version = "0.1.3" }
ch32rv-boot = { path = "crates/boot", version = "0.1.3" }

# 外部 crate(方針: architecture.ja.md §1.3。gdbstub は exact pin)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nusb = "0.2.7"
serialport = "4.10"
gdbstub = "=0.7.10"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# library 層で panic 経路を作らない(architecture.ja.md §2.2)
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
